<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPERATURE CONVERTER...</title>
    <link rel="stylesheet" href="temp.css">
</head>
<body> 
    <main>
      <div class="container">
        <div class="logo"></div>
      <h3>Convert <span style="color:rgb(174, 0, 255);">Temperature</span> into <span style="color:rgb(47, 0, 255);">Celsius</span>__<span style="color:rgb(255, 123, 0);">Fahrenheit</span>__<span style="color:rgb(255, 0, 255);">Kelvin</span>...</h3>
      <div class="box1">
        <p class="para1">Enter Temperature</p>
        <div class="box2">
          <div class="logo1"></div>
          <div class="val"> <input class="input" type="number" placeholder="Enter here.."></div>
          <div class="symbol">&#176C</div>
        </div>
      </div>
      <div class="container1">
        <div class="box3" id="boxx">
          <div class="celsius">&#176C</div>
          <h3 class="head1">Celsius</h3>
          <div class="result1"></div>
        </div>
        <div class="box4" id="boxx">
          <div class="celsius">&#176F</div>
          <h3 class="head2">Fahrenheit</h3>
          <div class="result2"></div>

        </div>
        <div class="box5" id="boxx">
          <div class="celsius">&#176K</div>
          <h3 class="head3">Kelvin</h3>
          <div class="result3"></div>
        </div>
      </div>
      </div>
    </main>
       <button>Reset me!</button>
  
</body>
<script src="temp.js"></script>
</html>
